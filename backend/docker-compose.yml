services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_local
      POSTGRES_DB: nexus
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${NEXUS_HTTP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:nexus_local@postgres:5432/nexus
      NEXUS_DEMO_MODE: "true"
      NEXUS_SEED_DEMO: "true"
      NEXUS_OBSERVABILITY_ENABLED: "${NEXUS_OBSERVABILITY_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      NEXUS_OBS_FAULT_NODE: "${NEXUS_OBS_FAULT_NODE:-}"
    depends_on:
      postgres:
        condition: service_healthy
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:16686:16686"
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.7.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${NEXUS_GRAFANA_PASSWORD:-nexus-local-demo}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger
  qdrant:
    profiles: ["search"]
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  qdrant_storage:
  prometheus_data:
  grafana_data:
